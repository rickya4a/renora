name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-alpine
        env:
          POSTGRES_USER: renora
          POSTGRES_PASSWORD: renora
          POSTGRES_DB: renora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renora -d renora_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Generated code is up to date
        run: |
          go tool gqlgen generate
          git diff --exit-code -- internal/graph
      - run: go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://renora:renora@localhost:5432/renora_test?sslmode=disable
        run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  image:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v5
      - run: docker build --build-arg VERSION=${{ github.sha }} --build-arg COMMIT=${{ github.sha }} -t renora/renora-api:ci .
